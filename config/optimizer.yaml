# Black-Litterman parameters
tau: 0.05                  # scaling factor for prior uncertainty
risk_aversion: 2.5         # market risk aversion (lambda)

# Position constraints
max_position_weight: 0.25  # maximum weight per sector ETF

# Risk target
vol_target: 0.12           # annualised portfolio volatility target

# Transaction cost model
turnover_penalty: 0.10     # L1 turnover penalty coefficient
transaction_cost_bps: 10   # one-way cost in basis points

# BL prior configuration — lookback window for covariance estimation (Ticket 3.1)
prior:
  lookback_days: 252

# Black-Litterman posterior blend parameters (Ticket 3.2)
black_litterman:
  tau: 0.05   # prior uncertainty scalar — scales how much views can move the equilibrium

# Transaction cost model — one-way costs for sector ETF trades (ADR-017, Ticket 3.4)
# Conservative: actual spreads are often <1bp, but 3bps total understates rather than
# overstates performance. min_trade_threshold avoids charging rounding noise.
transaction_costs:
  spread_bps: 1.0              # half-spread cost (one side)
  slippage_bps: 2.0            # market-impact / slippage estimate
  min_trade_threshold: 0.001   # |Δw| ≤ this → no cost charged (0.1% weight change)

# Portfolio optimization constraints and solver preferences (Ticket 3.3)
# ECOS not available in CVXPY 1.4+; CLARABEL is the modern equivalent default.
portfolio:
  max_position_weight: 0.25   # concentration cap per sector ETF
  vol_target: 0.12            # annualised portfolio volatility ceiling
  turnover_penalty: 0.10      # L1 turnover penalty coefficient (γ)
  solver_primary: CLARABEL    # first-choice solver (replaces ECOS in CVXPY 1.4+)
  solver_fallback: SCS        # fallback if primary fails

# Aggregator signal-to-return mapping and regime scaling (ADR-011)
# These are the primary backtest hyperparameters — change here, not in source.
aggregator:
  max_excess_return_annual: 0.05   # ±1 signal → ±5% annualised excess return
  omega_base: 0.0001               # view variance at unit conviction (~1bp² weekly)
  regime_scale_intercept: 0.75     # neutral regime multiplier
  regime_scale_slope: 0.25         # risk_off→0.50, neutral→0.75, risk_on→1.00

# SPY sector weights proxy for Black-Litterman equilibrium prior (ADR-016).
# Source: SSGA SPY factsheet — refresh quarterly when SPY rebalances.
# Excludes XLC (Communication Services) — not in our 10-ETF universe.
# Raw percentages; renormalized to sum=1 at call time (compute_equilibrium_returns).
market_cap_weights:
  XLK: 0.323   # Technology
  XLF: 0.131   # Financials
  XLV: 0.122   # Health Care
  XLY: 0.102   # Consumer Discretionary
  XLP: 0.059   # Consumer Staples
  XLE: 0.040   # Energy
  XLI: 0.089   # Industrials
  XLB: 0.026   # Materials
  XLRE: 0.025  # Real Estate
  XLU: 0.026   # Utilities

# Risk circuit breakers — pre-trade and post-trade checks (ADR-018, Ticket 3.5)
# Drawdown threshold: halt rebalance if rolling 20-day drawdown exceeds 15%.
# Turnover cap: blend 50/50 with previous weights if L1 turnover exceeds 50%.
# Vol breach: partially deleverage (20% blend toward equal weight) if realized vol > 1.5× vol_target.
risk:
  max_single_rebalance_turnover: 0.50
  max_drawdown_threshold: 0.15
  drawdown_lookback_days: 20
  vol_breach_multiplier: 1.50
  vol_deleveraging_blend: 0.20

# Per-mode agent weights (ADR-012)
# backtest: Polymarket has no historical data — weight redistributed to news+macro
# live: full 3-agent weights once Polymarket ingest catches up
aggregator_weights:
  backtest:
    news: 0.57
    macro: 0.43
    polymarket: 0.00
  live:
    news: 0.40
    macro: 0.30
    polymarket: 0.30
