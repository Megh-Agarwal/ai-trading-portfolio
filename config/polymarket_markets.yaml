# Curated macro-relevant Polymarket markets
#
# Market IDs are Gamma API numeric IDs (integer strings).
# To refresh this list:
#   1. curl https://gamma-api.polymarket.com/events?active=true&closed=false&limit=200
#   2. Find a market, copy its numeric "id" field
#   3. Update market_id below; re-run scripts/ingest_polymarket.py
#
# Sector impact notation:
#   positive_if_yes  — ETF price likely rises if the market resolves YES
#   negative_if_yes  — ETF price likely falls if the market resolves YES
#   mixed            — direction depends on magnitude or secondary effects
#
# Mapping last verified: 2026-06-12

markets:

  # ── Monetary policy ──────────────────────────────────────────────────────

  - market_id: "1439536"
    question: "Fed rate cut by July 2026 meeting?"
    category: economy
    confidence: high
    rationale: >
      Rate cuts directly expand equity multiples for rate-sensitive sectors
      and compress net interest margins for banks.
    sector_impacts:
      XLU: positive_if_yes    # utility dividends more attractive vs bonds
      XLRE: positive_if_yes   # lower mortgage rates support valuations
      XLF: negative_if_yes    # bank NIM compression outweighs volume boost
      XLK: positive_if_yes    # growth stocks re-rate on lower discount rate
      XLY: positive_if_yes    # consumer credit costs fall

  - market_id: "616905"
    question: "Will 3 fed rate cuts happen in 2026?"
    category: economy
    confidence: high
    rationale: >
      Cumulative rate path matters more than any single meeting for real estate
      and utility valuations; negative for bank margins over full year.
    sector_impacts:
      XLU: positive_if_yes
      XLRE: positive_if_yes
      XLF: negative_if_yes
      XLK: positive_if_yes
      XLB: positive_if_yes    # lower cost of capital for materials capex

  - market_id: "1115677"
    question: "Jerome Powell out from Fed Board by December 31?"
    category: economy
    confidence: medium
    rationale: >
      Fed leadership change signals policy uncertainty. Markets price in
      inflation risk and potential yield curve steepening.
    sector_impacts:
      XLU: negative_if_yes    # rate uncertainty hurts rate-sensitive sectors
      XLRE: negative_if_yes
      XLF: mixed              # uncertainty cuts both ways for banks
      XLK: negative_if_yes    # policy risk discount on growth stocks

  # ── Macro regime ─────────────────────────────────────────────────────────

  - market_id: "609655"
    question: "US recession by end of 2026?"
    category: economy
    confidence: high
    rationale: >
      Recession is the single most powerful sector-rotation signal:
      defensive (XLP, XLU, XLV) outperform; cyclical (XLY, XLF, XLI) underperform.
    sector_impacts:
      XLY: negative_if_yes    # consumer discretionary hardest hit
      XLF: negative_if_yes    # credit losses, NIM pressure
      XLI: negative_if_yes    # industrial capex collapses
      XLE: negative_if_yes    # demand destruction
      XLB: negative_if_yes    # commodity demand falls
      XLP: positive_if_yes    # staples are countercyclical
      XLU: positive_if_yes    # utilities are countercyclical
      XLV: positive_if_yes    # healthcare is countercyclical

  - market_id: "616902"
    question: "Will no Fed rate cuts happen in 2026?"
    category: economy
    confidence: medium
    rationale: >
      No cuts signal persistent inflation or policy caution, keeping long-end
      yields elevated — bad for duration-sensitive sectors, supports bank margins.
    sector_impacts:
      XLU: negative_if_yes    # higher-for-longer hurts yield proxies
      XLRE: negative_if_yes
      XLF: positive_if_yes    # NIM stays wide
      XLE: positive_if_yes    # inflation persistence benefits real assets
      XLB: positive_if_yes    # materials/commodities hedge inflation

  - market_id: "1087309"
    question: "Will US unemployment reach at least 5.0% in 2026?"
    category: economy
    confidence: medium
    rationale: >
      Unemployment above 5% signals labour market deterioration. Consumer
      spending falls; Fed likely accelerates cuts — conflicting effects.
    sector_impacts:
      XLY: negative_if_yes    # consumer spending falls
      XLF: negative_if_yes    # credit quality deteriorates
      XLI: negative_if_yes    # lower business investment
      XLP: positive_if_yes    # spending shifts to staples
      XLU: positive_if_yes    # rate cut expectations rise

  # ── Energy & commodities ─────────────────────────────────────────────────

  - market_id: "2126461"
    question: "Will Crude Oil reach a new all-time high by December 31?"
    category: economy
    confidence: medium
    rationale: >
      Oil all-time high (above ~$130/barrel) signals supply shock. Direct revenue
      tailwind for XLE; input cost headwind for industrials and consumer sectors.
    sector_impacts:
      XLE: positive_if_yes    # direct revenue tailwind
      XLB: positive_if_yes    # energy-related materials benefit
      XLI: negative_if_yes    # input cost pressure
      XLY: negative_if_yes    # transportation and consumer cost headwind
      XLP: negative_if_yes    # packaging/logistics cost headwind

  # ── Trade & geopolitics ──────────────────────────────────────────────────

  - market_id: "1259129"
    question: "100% tariff on Canada in effect by June 30?"
    category: politics
    confidence: medium
    rationale: >
      Broad North American tariffs disrupt industrial supply chains and raise
      input costs for manufacturing. Retaliation risk hits energy exporters.
    sector_impacts:
      XLI: negative_if_yes    # supply chain disruption
      XLB: negative_if_yes    # raw material cost increases
      XLY: negative_if_yes    # consumer goods price increases
      XLE: mixed              # Canada energy trade disruption uncertain

  - market_id: "665224"
    question: "Ukraine signs peace deal with Russia before 2027?"
    category: geopolitics
    confidence: low
    rationale: >
      Peace deal reduces energy supply disruption premium and commodity risk.
      European reconstruction demand is a tailwind for industrials and materials.
    sector_impacts:
      XLE: negative_if_yes    # energy supply premium evaporates
      XLB: negative_if_yes    # commodity risk premium falls
      XLI: positive_if_yes    # reconstruction demand
      XLK: positive_if_yes    # risk-on re-rating

  - market_id: "567621"
    question: "Will China invade Taiwan before 2027?"
    category: geopolitics
    confidence: low
    rationale: >
      Taiwan invasion would trigger semiconductor supply chain collapse and
      global risk-off. XLK most directly exposed via TSMC-dependent companies.
    sector_impacts:
      XLK: negative_if_yes    # semiconductor supply chain collapse
      XLI: negative_if_yes    # global trade disruption
      XLE: positive_if_yes    # safe-haven energy demand spike
      XLB: negative_if_yes    # trade route disruption

  # ── Sector-specific ──────────────────────────────────────────────────────

  - market_id: "1327148"
    question: "Will the U.S. 30-year Fixed-Rate Mortgage hit 5.90% (LOW) by December 31?"
    category: economy
    confidence: medium
    rationale: >
      Mortgage rates falling to 5.9% signals significant easing, boosting
      housing affordability and XLRE valuations. Positive for homebuilders.
    sector_impacts:
      XLRE: positive_if_yes   # lower financing costs support valuations
      XLF: mixed              # lower rates compress NIM but lift loan volume
      XLB: positive_if_yes    # construction materials demand rises

  - market_id: "950854"
    question: "Will S&P 500 have the best performance in 2026 vs Gold and Bitcoin?"
    category: economy
    confidence: medium
    rationale: >
      Equity outperformance signals risk-on sentiment and confidence in corporate
      earnings. Broad positive for cyclical sectors over defensive.
    sector_impacts:
      XLK: positive_if_yes    # growth leads in risk-on
      XLY: positive_if_yes    # consumer discretionary benefits
      XLF: positive_if_yes    # financials outperform in growth regime
      XLP: negative_if_yes    # defensives lag in risk-on
      XLU: negative_if_yes    # utilities lag in risk-on

  - market_id: "665494"
    question: "Will Trump reduce the deficit before 2027?"
    category: economy
    confidence: low
    rationale: >
      Deficit reduction implies lower Treasury supply, easing upward yield pressure.
      Rate-sensitive sectors benefit; reduces sovereign risk premium.
    sector_impacts:
      XLU: positive_if_yes    # lower yields support yield proxies
      XLRE: positive_if_yes
      XLF: mixed              # lower yields compress NIM
