[project]
name = "ai-trading-portfolio"
version = "0.1.0"
description = "Multi-agent LLM portfolio rebalancing system"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "cvxpy>=1.4.0",
    "finnhub-python>=2.4.0",
    "fredapi>=0.5.0",
    "google-cloud-bigquery>=3.42.1",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "py-clob-client>=0.34.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "sqlalchemy>=2.0.0",
    "yfinance>=0.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pyportfolioopt>=1.6.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
